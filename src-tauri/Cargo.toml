[package]
name = "patty"
version = "2.0.19"
description = "Patty"
edition = "2021"
rust-version = "1.85"

[features]
e2e = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9.0"
tiny_http = "0.12.0"
getrandom = "0.3.4"
rfd = "0.17.2"
sysinfo = "0.36.1"
encoding_rs = "0.8.35"
tauri-plugin-single-instance = "2.0.0-rc.5"
russh = { version = "=0.62.4", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["sync", "time"] }
bytes = "1"
futures = "0.3"
base64 = "=0.22.1"
unicode-general-category = "=1.1.0"

[dev-dependencies]
rand = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Data_Xml_Dom", "UI_Notifications", "Win32_UI_Notifications", "Win32_System_WinRT", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "=0.61.2"
uuid = { version = "=1.24.0", features = ["v5"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Power", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

# 开发构建仅保留行号级调试信息，大幅缩小 debug 符号（.pdb）体积
# 断点/单步仍可用，仅丢失局部变量类型细节；如需完整调试改回 debug = true
[profile.dev]
debug = "line-tables-only"
incremental = true
