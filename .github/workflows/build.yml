name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Use npm 11
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Test (frontend)
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: No explanatory comments
        run: npm run check:comments

      - name: Test (backend)
        run: cargo test --all-targets
        working-directory: src-tauri

      - name: Build
        run: npm run build

      - name: Verify OMP hook bundle
        run: node scripts/build-omp-hook.mjs --check

      - name: Package
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: patty-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
